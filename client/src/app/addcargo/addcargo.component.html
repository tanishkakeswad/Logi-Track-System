<div class="addcargo-page">

  <!-- Page Header -->
  <div class="page-header text-center">
    <h1>
      Manage <span>Cargo</span>
    </h1>
    <p>Create, assign, and track cargos</p>
  </div>

  <!-- Add Cargo Card -->
  <div class="container">
    <div class="card addcargo-card">
      <div class="card-header text-center">
        Add New Cargo
      </div>

      <div class="card-body">
        <form [formGroup]="itemForm" (ngSubmit)="onSubmit()">

          <div class="row g-3 justify-content-center">

            <div class="col-md-3">
              <label class="form-label">Content</label>
              <input type="text"
                     name="content"
                     formControlName="content"
                     (ngModel)="formModel.content"
                     class="form-control"
                     placeholder="Cargo content">

              <div *ngIf="itemForm.controls['content'].invalid && itemForm.controls['content'].touched">
                <span class="text-danger small">Please enter content</span>
              </div>
            </div>

            <div class="col-md-3">
              <label class="form-label">Size</label>
              <input type="text"
                     name="size"
                     formControlName="size"
                     (ngModel)="formModel.size"
                     class="form-control"
                     placeholder="Cargo size">

              <div *ngIf="itemForm.controls['size'].invalid && itemForm.controls['size'].touched">
                <span class="text-danger small">Please enter size</span>
              </div>
            </div>

            <div class="col-md-3">
              <label class="form-label">Status</label>
              <select class="form-select"
                      name="status"
                      formControlName="status"
                      (ngModel)="formModel.status">
                <option value="null">Choose Status</option>
                <option value="Order Pending">PENDING</option>
              </select>

              <div *ngIf="itemForm.controls['status'].invalid && itemForm.controls['status'].touched">
                <span class="text-danger small">Please select status</span>
              </div>
            </div>

            <div class="col-md-2 d-flex align-items-end">
              <button class="btn primary-btn w-100" type="submit">
                Submit
              </button>
            </div>

          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Search -->
  <div class="container mt-5">
    <div class="search-box">
      <input class="form-control"
             type="text"
             [(ngModel)]="cargoId"
             placeholder="Search A.W.B No.">

      <div class="search-actions">
        <button class="btn btn-outline-light" (click)="search()">Search</button>
        <button class="btn btn-success" (click)="getCargo()">View Cargo List</button>
      </div>
    </div>
  </div>

  <!-- Table -->
  <div class="container mt-4 table-responsive">
    <table class="table table-dark table-hover align-middle">
      <thead>
        <tr>
          <th class="text-center">A.W.B No.</th>
          <th>Content</th>
          <th>Size</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cargo of cargoToShow">
          <td class="text-center">{{cargo.id}}</td>
          <td>{{cargo.content}}</td>
          <td>{{cargo.size}}</td>
          <td>{{cargo.status}}</td>
          <td>
            <button
                class="btn btn-primary"
                data-bs-toggle="modal"
                data-bs-target="#driverModal"
                (click)="addDriver(cargo)">
                Assign
                </button>


            <button *ngIf="cargo.status !== 'Order Pending'"
                    class="btn btn-secondary"
                    disabled>
              {{cargo.status}}
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
