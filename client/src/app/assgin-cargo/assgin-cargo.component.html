<div class="assigned-cargo-page">

  <!-- Page Header -->
  <div class="page-header">
    <h2>Assigned Cargos</h2>
    <p>View and update the status of your assigned shipments</p>
  </div>

  <!-- Error / Empty State -->
  <div *ngIf="showError" class="alert custom-alert text-center">
    {{ errorMessage }}
  </div>

  <!-- Cargo Table -->
  <div class="table-responsive" *ngIf="cargList.length > 0">
    <table class="table cargo-table">
      <thead>
        <tr>
          <th>A.W.B No.</th>
          <th>Content</th>
          <th>Size</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cargo of cargList">
          <td>{{ cargo.id }}</td>
          <td>{{ cargo.content }}</td>
          <td>{{ cargo.size }}</td>
          <td>
            <span class="status-badge" [ngClass]="cargo.status">
              {{ cargo.status }}
            </span>
          </td>
          <td>
            <button
              class="btn update-btn"
              [disabled]="cargo.status === 'Order Delivered'"
              (click)="addStatus(cargo)"
              data-bs-toggle="modal"
              data-bs-target="#driverModal">
              Update Status
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

</div>

<!-- Update Status Modal -->
<div class="modal fade" id="driverModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header modal-header-custom">
        <h5 class="modal-title">Update Cargo Status</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <select [(ngModel)]="statusModel.newStatus" class="form-select">
          <option [ngValue]="null">Choose Status</option>
          <option value="Order In-transit">Order In-transit</option>
          <option value="Order Delivered">Order Delivered</option>
        </select>

        <div *ngIf="showMessage" class="alert alert-success mt-3">
          {{ responseMessage }}
        </div>

        <div *ngIf="showError" class="alert alert-danger mt-3">
          {{ errorMessage }}
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-secondary" data-bs-dismiss="modal">
          Cancel
        </button>
        <button class="btn save-btn" (click)="assignDriver()">
          Save
        </button>
      </div>

    </div>
  </div>
</div>
