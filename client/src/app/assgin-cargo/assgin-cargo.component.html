<div class="container mt-4">

  <h2 class="text-center mb-4">Manage Cargo</h2>

  <!-- DEBUG -->
  <p class="text-center">Total Cargo: {{ cargList.length }}</p>

  <!-- ERROR -->
  <div *ngIf="showError" class="alert alert-danger text-center">
    {{ errorMessage }}
  </div>

  <!-- TABLE -->
  <div class="table-responsive" *ngIf="cargList.length > 0">
    <table class="table table-dark table-hover text-center">
      <thead>
        <tr>
          <th>A.W.B No.</th>
          <th>Content</th>
          <th>Size</th>
          <th>Status</th>
          <th>Documents</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let cargo of cargList">
          <td>{{ cargo.id }}</td>
          <td>{{ cargo.content }}</td>
          <td>{{ cargo.size }}</td>
          <td>{{ cargo.status }}</td>
          <td>
            <div *ngIf="cargo.documents && cargo.documents.length > 0; else noDocs">
              <ul class="list-unstyled mb-0">
                <li *ngFor="let doc of cargo.documents">
                  {{ doc.originalFileName }}
                  <button class="btn btn-sm btn-link" (click)="viewDocument(doc.id)">
                    View
                  </button>
                </li>
              </ul>
            </div>

            <ng-template #noDocs>
              <span class="text-muted">No Documents</span>
            </ng-template>
          </td>
          <td>
            <button class="btn btn-primary" [disabled]="cargo.status === 'Order Delivered'" (click)="addStatus(cargo)"
              data-bs-toggle="modal" data-bs-target="#driverModal">
              Update Status
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- MODAL -->
  <div class="modal fade" id="driverModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Update Status</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">

          <select [(ngModel)]="statusModel.newStatus" class="form-control">
            <option [ngValue]="null">Choose Status</option>
            <option value="Order In-transit">Order In-transit</option>
            <option value="Order Delivered">Order Delivered</option>
          </select>

          <div *ngIf="showMessage" class="alert alert-success mt-3">
            {{ responseMessage }}
          </div>

          <div *ngIf="showError" class="alert alert-danger mt-3">
            {{ errorMessage }}
          </div>

        </div>

        <div class="modal-footer">
          <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button class="btn btn-primary" (click)="assignDriver()">Save</button>
        </div>

      </div>
    </div>
  </div>

  <!-- LOGOUT -->
  <button class="btn btn-danger w-100 mt-3" (click)="logout()">
    Logout
  </button>

</div>
