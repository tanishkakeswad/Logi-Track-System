<div class="dashboard-container">

  <!-- Navbar -->
  <nav class="navbar">
    <div class="logo">Cargo<span>Wala</span></div>
    <div class="nav-links">
      <a routerLink="/">Home</a>
      <a routerLink="/about">About Us</a>
      <a routerLink="/contact">Contact</a>
      <a routerLink="/login">Login</a>
    </div>
  </nav>

  <!-- Main Content -->
  <div class="dashboard-content">
    <h1>Welcome to <span>CargoWala</span></h1>
    <p class="subtitle">Customer Dashboard</p>

    <div class="card-container single-card">

      <!-- EXISTING CARD -->
      <div class="card">
        <h3>View Cargo Status</h3>
        <p>Track your shipments and delivery status</p>
        <button routerLink="/viewcargostatus">
          View Status
        </button>
      </div>

      <!-- 🔥 NEW TRACKING CARD -->
      <div class="card">
        <h3>Track Your Driver</h3>
        <p>Enter Driver ID to see live location</p>

        <input type="number" [(ngModel)]="driverId" placeholder="Enter Driver ID" />
        <button (click)="startTracking()">Track</button>

        <div id="customerMap"></div>
      </div>

    </div>
  </div>

</div>
