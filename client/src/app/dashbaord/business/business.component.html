<div class="business-dashboard">

  <div class="dashboard-container">

    <!-- Header -->
    <div class="dashboard-header">
      <h1 class="dashboard-title">
        Welcome to <span class="cargo-text">Cargo</span><span class="wala-text">Wala</span>
      </h1>
      <p class="dashboard-subtitle">
        Business Control Panel
      </p>
    </div>

    <!-- Actions -->
    <div class="dashboard-actions">

      <!-- Primary Action -->
      <button class="action-card primary" routerLink="/addcargo">
        <div class="card-icon">📦</div>
        <h3>Add & Assign Cargo</h3>
        <p>
          Create new cargos and assign drivers seamlessly from a single place.
        </p>
      </button>

      <!-- Secondary (optional / future-ready) -->
      <div class="action-card secondary disabled">
        <div class="card-icon">📊</div>
        <h3>Manage Shipments</h3>
        <p>
          Track, monitor and manage all your cargos in one dashboard.
        </p>
        <span class="coming-soon">Coming Soon</span>
      </div>

    </div>

    <!-- 🔥 TRACKING SECTION -->
    <div class="tracking-section">

      <h2>Driver Tracking</h2>

      <div class="tracking-controls">
        <input type="number" [(ngModel)]="selectedDriverId" placeholder="Enter Driver ID" />
        <button (click)="trackOneDriver()">Track Driver</button>
        <button (click)="showAllDrivers()">Show All</button>
      </div>

      <!-- 🔥 MAP -->
      <div id="businessMap"></div>

    </div>

  </div>

</div>
