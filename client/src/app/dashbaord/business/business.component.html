<div class="business-dashboard">

  <div class="dashboard-container">

    <h1 class="dashboard-title">
      Welcome to <span>Cargo</span><span>Wala</span>
    </h1>

    <p class="dashboard-subtitle">
      Business Control Panel
    </p>

    <div class="dashboard-actions">

      <button class="action-card" routerLink="/addcargo">
        <h3>Add Cargo</h3>
        <p>Create and manage new cargo shipments</p>
      </button>

      <button class="action-card" routerLink="/assgin-cargo">
        <h3>Assign Cargo</h3>
        <p>Assign cargos to drivers efficiently</p>
      </button>

    </div>

    <!-- 🔥 TRACKING SECTION -->
    <div class="tracking-section">

      <h2>Driver Tracking</h2>

      <div class="tracking-controls">
        <input type="number" [(ngModel)]="selectedDriverId" placeholder="Enter Driver ID" />
        <button (click)="trackOneDriver()">Track Driver</button>
        <button (click)="showAllDrivers()">Show All</button>
      </div>

      <!-- 🔥 MAP -->
      <div id="businessMap"></div>

    </div>

  </div>

</div>
