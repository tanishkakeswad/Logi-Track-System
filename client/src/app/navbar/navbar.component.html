<nav class="navbar navbar-expand-lg navbar-dark px-4 px-lg-5 transparent-nav">
  <a class="navbar-brand d-flex align-items-center"
     routerLink="/"
     (click)="closeMenu()">
    <img src="assets/logo.png" class="nav-logo" alt="CargoWala Logo" />
  </a>

  <button
    class="navbar-toggler"
    type="button"
    data-bs-toggle="collapse"
    data-bs-target="#nav"
    aria-controls="nav"
    aria-expanded="false"
    aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <div id="nav" #navCollapse class="collapse navbar-collapse">
    <ul class="navbar-nav ms-auto nav-links align-items-lg-center">

      <!-- Common links -->
      <li class="nav-item">
        <a class="nav-link"
           routerLink="/"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: true }"
           (click)="closeMenu()">
          Home
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link"
           routerLink="/about"
           routerLinkActive="active"
           (click)="closeMenu()">
          About Us
        </a>
      </li>

      <li class="nav-item">
        <a class="nav-link"
           routerLink="/contact"
           routerLinkActive="active"
           (click)="closeMenu()">
          Contact
        </a>
      </li>

      <!-- ✅ FAQs (added correctly) -->
      <li class="nav-item">
        <a class="nav-link"
           routerLink="/faq"
           routerLinkActive="active"
           (click)="closeMenu()">
          FAQs
        </a>
      </li>

      <!-- Role-based -->
      <li class="nav-item" *ngIf="isLoggedIn && role === 'CUSTOMER'">
        <a class="nav-link"
           routerLink="/viewcargostatus"
           routerLinkActive="active"
           (click)="closeMenu()">
          Track
        </a>
      </li>

      <li class="nav-item" *ngIf="isLoggedIn && role === 'BUSINESS'">
        <a class="nav-link"
           routerLink="/addcargo"
           routerLinkActive="active"
           (click)="closeMenu()">
          Create Cargo
        </a>
      </li>

      <li class="nav-item" *ngIf="isLoggedIn && role === 'DRIVER'">
        <a class="nav-link"
           routerLink="/assgin-cargo"
           routerLinkActive="active"
           (click)="closeMenu()">
          Cargos
        </a>
      </li>

      <!-- Login / Logout -->
      <li class="nav-item ms-lg-3" *ngIf="!isLoggedIn">
        <a class="nav-link nav-cta"
           routerLink="/login"
           (click)="closeMenu()">
          Login
        </a>
      </li>

      <li class="nav-item ms-lg-3" *ngIf="isLoggedIn">
        <a class="nav-link nav-cta"
           style="cursor:pointer"
           (click)="logout(); closeMenu()">
          Logout
        </a>
      </li>

    </ul>
  </div>
</nav>
