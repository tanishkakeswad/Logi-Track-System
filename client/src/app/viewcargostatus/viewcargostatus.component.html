<div class="view-status-page">

  <!-- Page Header -->
  <div class="page-header text-center">
    <h1>
      Track <span>Cargo</span> Status
    </h1>
    <p>Enter your Cargo ID to get real-time updates</p>
  </div>

  <!-- Form Card -->
  <div class="container d-flex justify-content-center">
    <div class="card status-card">

      <form [formGroup]="cargoForm" (ngSubmit)="getStatus()">

        <div class="mb-3">
          <label class="form-label">Cargo ID</label>
          <input
            type="number"
            class="form-control"
            formControlName="cargoId"
            placeholder="Enter Cargo ID" />

          <div
            *ngIf="cargoForm.get('cargoId')?.invalid && cargoForm.get('cargoId')?.touched"
            class="text-danger mt-1">
            Cargo ID is required
          </div>
        </div>

        <button class="btn primary-btn w-100" type="submit">
          Get Status
        </button>

      </form>

      <!-- Error -->
      <div *ngIf="errorMessage" class="alert alert-danger mt-3">
        {{ errorMessage }}
      </div>

      <!-- Result -->
      <div *ngIf="showResult" class="status-result mt-4">

        <div class="result-item">
          <span> Cargo ID</span>
          <strong>{{ cargoData?.cargoId }}</strong>
        </div>

        <div class="result-item">
          <span>Status</span>
          <strong class="status-badge">
            {{ cargoData?.status }}
          </strong>
        </div>

        <div class="result-item">
          <span>Source</span>
          <strong>{{ cargoData?.source }}</strong>
        </div>

        <div class="result-item">
          <span>Destination</span>
          <strong>{{ cargoData?.destination }}</strong>
        </div>

      </div>

    </div>
  </div>

</div>
