<div class="register-bg">

  <div class="container h-100">
    <div class="row h-100 justify-content-center align-items-center">

      <div class="col-12 col-md-8 col-lg-5">

        <div class="card register-card">
          <div class="card-body p-4">

            <h3 class="fw-bold text-uppercase mb-1 text-center fs-1">
              <span class="custom-cargo-color">Cargo</span><span class="custom-wala-color">Wala</span>
            </h3>

            <p class="text-center text-black mb-4">
              Please enter your details here
            </p>

            <form [formGroup]="itemForm" (ngSubmit)="onRegister()">

              <!-- Username -->
              <div class="mb-3">
                <label class="form-label">Username <span class="text-danger">*</span></label>
                <input type="text" formControlName="username" class="form-control" placeholder="Enter username">
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label class="form-label">Email <span class="text-danger">*</span></label>
                <input type="email" formControlName="email" class="form-control" placeholder="name@example.com">
              </div>

              <!-- Password -->
              <div class="mb-3">
                <label class="form-label">Password <span class="text-danger">*</span></label>
                <input [type]="passwordFieldType" formControlName="password" class="form-control" placeholder="••••••">
              </div>

              <!-- Confirm -->
              <div class="mb-3">
                <label class="form-label">Confirm Password</label>
                <input [type]="passwordFieldType" class="form-control" placeholder="••••••">
              </div>

              <!-- Role -->
              <div class="mb-4">
                <label class="form-label">Role <span class="text-danger">*</span></label>
                <select class="form-select" formControlName="role">
                  <option value="">Choose user type</option>
                  <option value="BUSINESS">Business</option>
                  <option value="DRIVER">Driver</option>
                  <option value="CUSTOMER">Customer</option>
                </select>
              </div>

              <!-- Submit -->
              <button class="btn btn-custom-gradient w-100 " [disabled]="itemForm.invalid" type="submit">Submit</button>

            </form>

            <!-- go to login -->
            <p class="text-center mt-3 mb-0">
              <a routerLink="/login" class="fw-bold custom-cargo-color text-decoration-none">Go to Login</a>
            </p>

          </div>
        </div>

      </div>
    </div>
  </div>

</div>
