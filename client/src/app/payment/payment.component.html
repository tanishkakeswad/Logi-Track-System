<div class="payment-page">

  <div class="container">

    <!-- Header -->
    <div class="payment-header">
      <div class="page-chip">Secure Checkout</div>
      <h1>Payment</h1>
      <p>Finalize shipment payment securely and continue operations.</p>
    </div>

    <!-- Estimated Price -->
    <div class="alert alert-info" *ngIf="previewAmountInPaise !== null">
      Estimated Amount:
      <strong>₹ {{ (previewAmountInPaise / 100) }}</strong>
    </div>

    <!-- Error -->
    <div class="alert alert-danger" *ngIf="message && message.startsWith('❌')">
      {{ message }}
    </div>

    <!-- Success -->
    <div class="alert alert-success" *ngIf="message && message.startsWith('✅')">
      {{ message }}
    </div>

    <!-- ✅ RETURN CTA (ONLY AFTER SUCCESS) -->
    <div class="text-center mt-4" *ngIf="paymentCompleted">
      <button class="btn primary-btn px-4"
              (click)="goBackToCargo()">
        Return to Cargo Dashboard
      </button>
    </div>

    <!-- Card -->
    <div class="card glass-card payment-card" *ngIf="!paymentCompleted">

      <form [formGroup]="paymentForm" (ngSubmit)="pay()">

        <div class="row g-4">

          <!-- Source -->
          <div class="col-md-6">
            <label class="form-label">Source City</label>
            <select class="form-select" formControlName="sourceCity">
              <option value="">Choose</option>
              <option *ngFor="let c of supportedCities" [value]="c">
                {{ c }}
              </option>
            </select>
          </div>

          <!-- Destination -->
          <div class="col-md-6">
            <label class="form-label">Destination City</label>
            <select class="form-select" formControlName="destinationCity">
              <option value="">Choose</option>
              <option *ngFor="let c of supportedCities" [value]="c">
                {{ c }}
              </option>
            </select>
          </div>

          <!-- Weight -->
          <div class="col-md-6">
            <label class="form-label">Weight (KG)</label>
            <input type="number"
                   class="form-control"
                   formControlName="size"
                   min="1"
                   max="10000"
                   placeholder="Enter cargo weight" />
            <small class="field-error"
              *ngIf="paymentForm.get('size')?.touched && paymentForm.get('size')?.invalid">
              Weight must be between 1 and 10000 KG
            </small>
          </div>

          <!-- Driver -->
          <div class="col-md-3">
            <label class="form-label">Driver ID</label>
            <input type="number"
                   class="form-control readonly"
                   formControlName="driverId"
                   readonly />
          </div>

          <!-- Cargo -->
          <div class="col-md-3">
            <label class="form-label">Cargo ID</label>
            <input type="number"
                   class="form-control readonly"
                   formControlName="cargoId"
                   readonly />
          </div>

        </div>

        <!-- Action -->
        <button
          class="btn primary-btn w-100 mt-4"
          type="submit"
          [disabled]="loading || paymentCompleted">
          {{ loading ? 'Processing...' : 'Calculate & Pay' }}
        </button>

      </form>

    </div>

  </div>
</div>
