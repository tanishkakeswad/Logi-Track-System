<!-- Floating Button -->
<button class="chat-fab btn btn-primary" (click)="toggle()">
  💬
</button>

<!-- Chat Window -->
<div class="chat-window card shadow" *ngIf="isOpen">
  <div class="card-header d-flex justify-content-between align-items-center">
    <strong>LogiBot</strong>
    <button class="btn btn-sm btn-outline-light" (click)="close()">✕</button>
  </div>

  <div class="card-body chat-body" id="chatScrollBox">
    <div *ngFor="let m of messages" class="mb-2">
      <div
        class="chat-bubble"
        [ngClass]="{ 'user-bubble': m.from === 'user', 'bot-bubble': m.from === 'bot' }">
        {{ m.text }}
      </div>
    </div>

    <div *ngIf="loading" class="text-muted small">
      LogiBot is typing...
    </div>
  </div>

  <div class="card-footer d-flex gap-2">
    <input
      class="form-control"
      placeholder="Type your message..."
      [(ngModel)]="input"
      (keydown)="onEnter($event)"
    />
    <button class="btn btn-success" (click)="send()" [disabled]="loading">Send</button>
  </div>
</div>
