<div class="chatbot-layer">

  <button class="chat-fab" type="button" (click)="toggle()" aria-label="Open chat">
  <img
    src="assets/chatbot.svg"
    alt=""
    class="chat-fab-svg"
    aria-hidden="true"
  />
</button>

  <!-- Chat Window -->
  <div class="chat-window" *ngIf="isOpen" role="dialog" aria-label="CargoWala Assistant">
    <div class="chat-header">
      <div class="chat-title">
        <span class="bot-dot"></span>
        <strong>CargoWala Assistant</strong>
        <span class="chat-subtitle">Support • Tracking • Payments</span>
      </div>

      <button class="chat-close" type="button" (click)="close()" aria-label="Close chat">
        <span class="close-x">×</span>
      </button>
    </div>

    <div class="chat-body" id="chatScrollBox">
      <div *ngFor="let m of messages"
           class="msg-row"
           [ngClass]="{ 'row-user': m.from === 'user', 'row-bot': m.from === 'bot' }">

        <div class="chat-bubble"
             [ngClass]="{ 'user-bubble': m.from === 'user', 'bot-bubble': m.from === 'bot' }">
          {{ m.text }}
          <div class="msg-time">{{ m.time | date:'shortTime' }}</div>
        </div>
      </div>

      <div *ngIf="loading" class="typing">
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-dot"></span>
        <span class="typing-text">Assistant is typing…</span>
      </div>
    </div>

    <div class="chat-footer">
      <input
        class="chat-input"
        placeholder="Type your message…"
        [(ngModel)]="input"
        (keydown)="onEnter($event)"
        [disabled]="loading"
      />
      <button class="chat-send"
              type="button"
              (click)="send()"
              [disabled]="loading || !input.trim()">
        Send
      </button>
    </div>
  </div>

</div>
